<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijener Shifri</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .panel {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 20px;
            background: #fafafa;
        }

        .panel h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #444;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: #0066cc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #004e99;
        }

        .result-box {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            word-break: break-all;
            min-height: 45px;
            font-family: monospace;
            font-size: 15px;
            color: #0066cc;
        }

        /* Mobil qurilmalar uchun moslashuv */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>Vijener Shifri </h1>

    <div class="container">
        <!-- 1-Qism: Shifrlash -->
        <div class="panel">
            <h2>Shifrlash</h2>
            <div class="form-group">
                <label for="enc-text">Asliy matn:</label>
                <textarea id="enc-text" placeholder="Matnni kiriting..."></textarea>
            </div>
            <div class="form-group">
                <label for="enc-key">Kalit so'z:</label>
                <input type="text" id="enc-key" placeholder="Kalitni kiriting...">
            </div>
            <button onclick="runCipher('encrypt')">Shifrlash</button>
            <div class="form-group" style="margin-top: 15px;">
                <label>Natija:</label>
                <div class="result-box" id="enc-result"></div>
            </div>
        </div>

        <!-- 2-Qism: Deshifrlash -->
        <div class="panel">
            <h2>Deshifrlash</h2>
            <div class="form-group">
                <label for="dec-text">Shifrlangan matn:</label>
                <textarea id="dec-text" placeholder="Shifrlangan matnni kiriting..."></textarea>
            </div>
            <div class="form-group">
                <label for="dec-key">Kalit so'z:</label>
                <input type="text" id="dec-key" placeholder="Kalitni kiriting...">
            </div>
            <button onclick="runCipher('decrypt')">Deshifrlash</button>
            <div class="form-group" style="margin-top: 15px;">
                <label>Natija:</label>
                <div class="result-box" id="dec-result"></div>
            </div>
        </div>
    </div>
    <br>
    <h1>with Bozorqulov Sardor</h1>

    <script>
        function vigenere(text, key, action) {
            if (!text || !key) return "Matn va kalitni kiriting!";
            
            let result = "";
            let keyIndex = 0;

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let code = char.charCodeAt(0);

                // Katta harflar (A-Z)
                if (code >= 65 && code <= 90) {
                    let kChar = key[keyIndex % key.length].toUpperCase();
                    let shift = kChar.charCodeAt(0) - 65;
                    
                    if (action === 'encrypt') {
                        char = String.fromCharCode(((code - 65 + shift) % 26) + 65);
                    } else {
                        char = String.fromCharCode(((code - 65 - shift + 26) % 26) + 65);
                    }
                    keyIndex++;
                }
                // Kichik harflar (a-z)
                else if (code >= 97 && code <= 122) {
                    let kChar = key[keyIndex % key.length].toLowerCase();
                    let shift = kChar.charCodeAt(0) - 97;
                    
                    if (action === 'encrypt') {
                        char = String.fromCharCode(((code - 97 + shift) % 26) + 97);
                    } else {
                        char = String.fromCharCode(((code - 97 - shift + 26) % 26) + 97);
                    }
                    keyIndex++;
                }
                result += char;
            }
            return result;
        }

        function runCipher(action) {
            if (action === 'encrypt') {
                let text = document.getElementById('enc-text').value;
                let key = document.getElementById('enc-key').value;
                document.getElementById('enc-result').innerText = vigenere(text, key, 'encrypt');
            } else {
                let text = document.getElementById('dec-text').value;
                let key = document.getElementById('dec-key').value;
                document.getElementById('dec-result').innerText = vigenere(text, key, 'decrypt');
            }
        }
    </script>
</body>
</html>
